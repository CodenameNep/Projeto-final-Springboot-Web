<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${equipamento.id == null ? 'Novo Equipamento - TechFix OS' : 'Editar Equipamento - TechFix OS'}">Equipamento - TechFix OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-tools text-primary me-2"></i>TechFix OS
        </a>
    </div>
</nav>

<main class="container py-4" style="max-width: 680px;">
    <div class="mb-3">
        <h2 class="fw-bold mb-1" th:text="${equipamento.id == null ? 'Cadastrar Novo Equipamento' : 'Editar Equipamento'}">Equipamento</h2>
        <p class="text-muted small">Vincule o aparelho a um cliente cadastrado na assistência.</p>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <form th:action="@{/equipamentos}" th:object="${equipamento}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-semibold">Cliente Proprietário *</label>
                    <select id="clienteId" class="form-select" th:field="*{clienteId}" required>
                        <option value="">Selecione o cliente...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome + ' (' + c.telefone + ')'}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                    <div class="form-text small" th:if="${#lists.isEmpty(clientes)}">
                        <span class="text-danger">Atenção:</span> Nenhum cliente cadastrado. Cadastre um cliente antes.
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="tipo" class="form-label fw-semibold">Tipo do Aparelho *</label>
                        <input id="tipo" type="text" class="form-control" th:field="*{tipo}" placeholder="Ex: Smartphone, Notebook, Desktop" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="marca" class="form-label fw-semibold">Marca *</label>
                        <input id="marca" type="text" class="form-control" th:field="*{marca}" placeholder="Ex: Samsung, Apple, Dell, Lenovo" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="modelo" class="form-label fw-semibold">Modelo *</label>
                        <input id="modelo" type="text" class="form-control" th:field="*{modelo}" placeholder="Ex: Galaxy S22, Inspiron 3501" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="numeroSerie" class="form-label fw-semibold">Número de Série / IMEI</label>
                        <input id="numeroSerie" type="text" class="form-control" th:field="*{numeroSerie}" placeholder="Ex: SN-9876543210">
                        <div class="text-danger small" th:if="${#fields.hasErrors('numeroSerie')}" th:errors="*{numeroSerie}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a class="btn btn-outline-secondary" th:href="@{/equipamentos}">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold" th:disabled="${#lists.isEmpty(clientes)}">
                        <i class="bi bi-check-lg me-1"></i>Salvar Equipamento
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
