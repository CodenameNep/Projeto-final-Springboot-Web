<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário - TechFix OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">TechFix OS</a>
    </div>
</nav>

<main class="container py-4" style="max-width: 680px;">
    <h2 class="mb-3">Cadastrar usuário</h2>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/usuarios}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="100" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input id="email" type="email" class="form-control" th:field="*{email}" maxlength="120" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input id="senha" name="senha" type="password" class="form-control" minlength="6" maxlength="72" required autocomplete="new-password">
                    <div class="form-text">Pelo menos 6 caracteres. A senha será armazenada criptografada.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>

                <div class="mb-4">
                    <label for="perfil" class="form-label">Perfil</label>
                    <select id="perfil" class="form-select" th:field="*{perfil}" required>
                        <option value="">Selecione...</option>
                        <option th:each="perfil : ${perfis}" th:value="${perfil.name()}" th:text="${perfil.descricao}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
