<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente.id == null ? 'Novo Cliente - TechFix OS' : 'Editar Cliente - TechFix OS'}">Cliente - TechFix OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-tools text-primary me-2"></i>TechFix OS
        </a>
    </div>
</nav>

<main class="container py-4" style="max-width: 820px;">
    <div class="mb-3">
        <h2 class="fw-bold mb-1" th:text="${cliente.id == null ? 'Cadastrar Novo Cliente' : 'Editar Dados do Cliente'}">Cliente</h2>
        <p class="text-muted small">Preencha os dados de contato e endereço com preenchimento automático via CEP.</p>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <form th:action="@{/clientes}" th:object="${cliente}" method="post" id="formCliente">
                <input type="hidden" th:field="*{id}">

                <h5 class="fw-bold border-bottom pb-2 mb-3 text-secondary">
                    <i class="bi bi-person me-2"></i>Dados Básicos
                </h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="nome" class="form-label fw-semibold">Nome Completo *</label>
                        <input id="nome" type="text" class="form-control" th:field="*{nome}" placeholder="Ex: Maria Silva" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp *</label>
                        <input id="telefone" type="text" class="form-control" th:field="*{telefone}" placeholder="(11) 98765-4321" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}" placeholder="cliente@email.com">
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>

                <h5 class="fw-bold border-bottom pb-2 mb-3 text-secondary">
                    <i class="bi bi-geo-alt me-2"></i>Endereço (Integração ViaCEP)
                </h5>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="cep" class="form-label fw-semibold">CEP *</label>
                        <div class="input-group">
                            <input id="cep" type="text" class="form-control" th:field="*{cep}" placeholder="00000-000" maxlength="9" required>
                            <button type="button" class="btn btn-outline-primary" id="btnBuscarCep" title="Consultar no ViaCEP">
                                <i class="bi bi-search" id="iconBuscar"></i>
                                <span class="spinner-border spinner-border-sm d-none" id="spinnerCep" role="status"></span>
                            </button>
                        </div>
                        <div class="form-text small" id="msgCep">Digite 8 dígitos e clique na lupa ou saia do campo.</div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="logradouro" class="form-label fw-semibold">Logradouro (Rua / Av.) *</label>
                        <input id="logradouro" type="text" class="form-control" th:field="*{logradouro}" placeholder="Rua das Flores" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
                    </div>
                    <div class="col-md-2">
                        <label for="numero" class="form-label fw-semibold">Número *</label>
                        <input id="numero" type="text" class="form-control" th:field="*{numero}" placeholder="123" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label for="complemento" class="form-label fw-semibold">Complemento</label>
                        <input id="complemento" type="text" class="form-control" th:field="*{complemento}" placeholder="Apto 101, Bloco B">
                        <div class="text-danger small" th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="bairro" class="form-label fw-semibold">Bairro *</label>
                        <input id="bairro" type="text" class="form-control" th:field="*{bairro}" placeholder="Centro" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="cidade" class="form-label fw-semibold">Cidade *</label>
                        <input id="cidade" type="text" class="form-control" th:field="*{cidade}" placeholder="São Paulo" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
                    </div>
                    <div class="col-md-1">
                        <label for="uf" class="form-label fw-semibold">UF *</label>
                        <input id="uf" type="text" class="form-control text-uppercase" th:field="*{uf}" placeholder="SP" maxlength="2" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i>Salvar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>    const cepInput = document.getElementById('cep');
    const btnBuscarCep = document.getElementById('btnBuscarCep');
    const msgCep = document.getElementById('msgCep');
    const iconBuscar = document.getElementById('iconBuscar');
    const spinnerCep = document.getElementById('spinnerCep');

    function buscarCep() {
        const cepValor = cepInput.value.replace(/\D/g, '');
        if (cepValor.length !== 8) {
            msgCep.className = 'form-text text-warning small';
            msgCep.textContent = 'Informe um CEP válido com 8 dígitos para consultar.';
            return;
        }

        iconBuscar.classList.add('d-none');
        spinnerCep.classList.remove('d-none');
        msgCep.className = 'form-text text-primary small';
        msgCep.textContent = 'Consultando ViaCEP...';

        fetch('/clientes/cep/' + cepValor)
            .then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.erro || 'CEP não encontrado');
                }
                return data;
            })
            .then(endereco => {
                document.getElementById('logradouro').value = endereco.logradouro || '';
                document.getElementById('bairro').value = endereco.bairro || '';
                document.getElementById('cidade').value = endereco.cidade || '';
                document.getElementById('uf').value = endereco.uf || '';
                msgCep.className = 'form-text text-success small';
                msgCep.textContent = '✓ Endereço preenchido automaticamente pelo ViaCEP!';
                document.getElementById('numero').focus();
            })
            .catch(err => {
                msgCep.className = 'form-text text-danger small';
                msgCep.textContent = '✕ ' + err.message;
            })
            .finally(() => {
                iconBuscar.classList.remove('d-none');
                spinnerCep.classList.add('d-none');
            });
    }

    btnBuscarCep.addEventListener('click', buscarCep);
    cepInput.addEventListener('blur', () => {
        if (cepInput.value.trim() !== '') {
            buscarCep();
        }
    });

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
