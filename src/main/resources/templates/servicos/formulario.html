<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${servico.id == null ? 'Novo Serviço - TechFix OS' : 'Editar Serviço - TechFix OS'}">Serviço - TechFix OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-tools text-primary me-2"></i>TechFix OS
        </a>
    </div>
</nav>

<main class="container py-4" style="max-width: 680px;">
    <div class="mb-3">
        <h2 class="fw-bold mb-1" th:text="${servico.id == null ? 'Cadastrar Novo Serviço' : 'Editar Serviço'}">Serviço</h2>
        <p class="text-muted small">Defina o nome da mão de obra/serviço e o preço padrão cobrado na assistência.</p>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <form th:action="@{/servicos}" th:object="${servico}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome do Serviço *</label>
                    <input id="nome" type="text" class="form-control" th:field="*{nome}" placeholder="Ex: Formatação com Backup, Troca de Conector" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label for="precoBase" class="form-label fw-semibold">Preço-Base (R$) *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light fw-bold">R$</span>
                        <input id="precoBase" type="number" step="0.01" min="0" class="form-control" th:field="*{precoBase}" placeholder="120.00" required>
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('precoBase')}" th:errors="*{precoBase}"></div>
                </div>

                <div class="mb-4">
                    <label for="descricao" class="form-label fw-semibold">Descrição / Detalhes</label>
                    <textarea id="descricao" class="form-control" th:field="*{descricao}" rows="3" placeholder="Descreva os procedimentos padrão deste serviço..."></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a class="btn btn-outline-secondary" th:href="@{/servicos}">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i>Salvar Serviço
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
