<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abrir ordem de serviço - TechFix OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/}">TechFix OS</a><a class="btn btn-outline-light btn-sm" th:href="@{/ordens}">Ordens de serviço</a></div></nav>
<main class="container py-4" style="max-width:850px">
    <h2 class="mb-3">Abrir ordem de serviço</h2>
    <p class="text-muted">O técnico responsável será o usuário autenticado.</p>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <form class="card shadow-sm p-4" th:action="@{/ordens}" th:object="${ordem}" method="post">
        <div class="mb-3">
            <label for="clienteId" class="form-label">Cliente *</label>
            <select id="clienteId" th:field="*{clienteId}" class="form-select" required>
                <option value="">Selecione o cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>
            <small class="text-danger" th:errors="*{clienteId}"></small>
        </div>
        <div class="mb-3">
            <label for="equipamentoId" class="form-label">Equipamento do cliente *</label>
            <select id="equipamentoId" th:field="*{equipamentoId}" class="form-select" required>
                <option value="">Selecione o equipamento</option>
                <option th:each="e : ${equipamentos}" th:value="${e.id}"
                        th:attr="data-cliente=${e.cliente.id}"
                        th:text="${e.tipo + ' - ' + e.marca + ' ' + e.modelo}"></option>
            </select>
            <small class="text-danger" th:errors="*{equipamentoId}"></small>
        </div>
        <div class="mb-3">
            <label for="defeitoRelatado" class="form-label">Defeito relatado *</label>
            <textarea id="defeitoRelatado" th:field="*{defeitoRelatado}" maxlength="1000" rows="4" class="form-control" required></textarea>
            <small class="text-danger" th:errors="*{defeitoRelatado}"></small>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Abrir OS</button>
            <a th:href="@{/ordens}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
<script>    const cliente = document.getElementById('clienteId');
    const equipamento = document.getElementById('equipamentoId');
    function filtrarEquipamentos() {
        for (const opcao of equipamento.options) {
            if (!opcao.value) continue;
            opcao.hidden = opcao.dataset.cliente !== cliente.value;
            opcao.disabled = opcao.hidden;
        }
        if (equipamento.selectedOptions.length && equipamento.selectedOptions[0].disabled) {
            equipamento.value = '';
        }
    }
    cliente.addEventListener('change', filtrarEquipamentos);
    filtrarEquipamentos();

</script>
</body>
</html>
