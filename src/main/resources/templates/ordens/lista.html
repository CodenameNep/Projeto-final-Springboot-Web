<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordens de serviço - TechFix OS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/}">TechFix OS</a></div></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3"><h2>Ordens de serviço</h2><a class="btn btn-primary" th:href="@{/ordens/nova}">Nova OS</a></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

    <div class="card border-0 shadow-sm p-3 mb-4">
        <form th:action="@{/ordens}" method="get" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label for="clienteNome" class="form-label small fw-semibold">Cliente</label>
                <input type="text" id="clienteNome" name="clienteNome" class="form-control form-control-sm"
                       placeholder="Buscar por nome..." th:value="${clienteNomeFiltro}">
            </div>
            <div class="col-md-3">
                <label for="status" class="form-label small fw-semibold">Status</label>
                <select id="status" name="status" class="form-select form-select-sm">
                    <option value="">Todos os status</option>
                    <option th:each="st : ${statusList}"
                            th:value="${st.name()}"
                            th:text="${st.descricao}"
                            th:selected="${statusSelecionado != null && statusSelecionado == st}">
                    </option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="dataInicio" class="form-label small fw-semibold">Abertura (De)</label>
                <input type="date" id="dataInicio" name="dataInicio" class="form-control form-control-sm"
                       th:value="${dataInicioFiltro}">
            </div>
            <div class="col-md-2">
                <label for="dataFim" class="form-label small fw-semibold">Abertura (Até)</label>
                <input type="date" id="dataFim" name="dataFim" class="form-control form-control-sm"
                       th:value="${dataFimFiltro}">
            </div>
            <div class="col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-primary flex-fill">🔍 Filtrar</button>
                <a th:if="${filtrosAtivos}" th:href="@{/ordens}" class="btn btn-sm btn-outline-secondary" title="Limpar filtros">✕</a>
            </div>
        </form>
        <div th:if="${filtrosAtivos}" class="mt-2 pt-2 border-top d-flex justify-content-between align-items-center">
            <span class="badge bg-info text-dark">
                Filtro ativo: <span th:text="${#lists.size(ordens)}"></span> ordem(ns) encontrada(s)
            </span>
            <a th:href="@{/ordens}" class="small text-decoration-none text-muted">Limpar filtros</a>
        </div>
    </div>
    <div class="card border-0 shadow-sm table-responsive"><table class="table table-hover mb-0 align-middle">
    <thead><tr><th>Protocolo</th><th>Cliente</th><th>Equipamento</th><th>Abertura</th><th>Status</th><th>Total</th><th></th></tr></thead>
    <tbody><tr th:each="os : ${ordens}">
        <td th:text="${os.numeroProtocolo}"></td>
        <td th:text="${os.cliente.nome}"></td>
        <td th:text="${os.equipamento.marca + ' ' + os.equipamento.modelo}"></td>
        <td th:text="${#temporals.format(os.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${os.status.descricao}"></td>
        <td th:text="${'R$ ' + #numbers.formatDecimal(os.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
        <td><a class="btn btn-sm btn-outline-primary" th:href="@{/ordens/{id}(id=${os.id})}">Detalhes</a></td>
    </tr><tr th:if="${#lists.isEmpty(ordens)}"><td colspan="7" class="text-center text-muted py-4">Nenhuma ordem de serviço cadastrada.</td></tr></tbody>
    </table></div>
    <a class="btn btn-link mt-3" th:href="@{/}">Voltar</a>
</main></body></html>
